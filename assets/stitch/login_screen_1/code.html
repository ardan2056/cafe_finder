<script>
        // Simple Interaction logic
        const togglePassword = document.querySelector('button[type="button"]');
        const passwordInput = document.getElementById('password');
        const passwordIcon = togglePassword.querySelector('.material-symbols-outlined');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordIcon.innerText = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Atmospheric mouse track effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const shaderContainer = document.querySelector('webgl-shader');
            if(shaderContainer) {
                // Subtle adjustment to shader opacity or transformation based on mouse
                shaderContainer.style.opacity = 0.2 + (x * 0.1);
            }
        });
    </script>

<script>
        let isExpanded = false;
        const sheet = document.getElementById('bottom-sheet');
        const extraDetails = document.getElementById('extra-details');

        function toggleSheet() {
            // Simplified toggle for demonstration
            sheet.style.transform = isExpanded ? 'translateY(0)' : 'translateY(-20px)';
        }

        function toggleSheetHeight() {
            isExpanded = !isExpanded;
            if (isExpanded) {
                extraDetails.classList.remove('hidden');
                sheet.style.transform = 'translateY(-100px)';
            } else {
                extraDetails.classList.add('hidden');
                sheet.style.transform = 'translateY(0)';
            }
        }

        // Add ripple effect or micro-interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                this.classList.add('active:scale-95');
                setTimeout(() => this.classList.remove('active:scale-95'), 200);
            });
        });
    </script>

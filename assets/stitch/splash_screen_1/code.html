<script>
        // Automatic Transition Logic
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splash-screen');
            const login = document.getElementById('login-screen');

            // Wait for 3.5 seconds (allowing for some loading feel)
            setTimeout(() => {
                // Fade out splash
                splash.classList.add('opacity-0', 'scale-110', 'pointer-events-none');
                
                // Show login screen
                login.classList.remove('hidden');
                
                // Wait for a tiny tick to trigger entrance animation
                requestAnimationFrame(() => {
                    login.classList.remove('opacity-0', 'scale-110');
                    login.classList.add('opacity-100', 'scale-100');
                });

                // Cleanup splash after transition
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 800);
            }, 3500);
        });

        // Simple input interaction effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-md');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-md');
            });
        });
    </script>

<script>
        // Simple Interaction Logic
        const sheet = document.getElementById('bottomSheet');
        const handle = document.getElementById('sheetHandle');
        let isExpanded = false;

        if (handle) {
            handle.addEventListener('click', () => {
                isExpanded = !isExpanded;
                if (isExpanded) {
                    sheet.style.transform = 'translateY(-80px)'; // Elevate to show more info
                } else {
                    sheet.style.transform = 'translateY(0%)';
                }
            });
        }

        // Handle micro-interactions for marker clicking
        document.querySelectorAll('button[aria-label="Other Cafe"]').forEach(marker => {
            marker.addEventListener('click', (e) => {
                const markerIcon = marker.querySelector('.material-symbols-outlined');
                // Simulate focus
                marker.classList.toggle('opacity-80');
                marker.classList.toggle('scale-110');
            });
        });

        // Prevention of default scrolling on map view
        document.addEventListener('touchmove', function (e) {
            if (e.target.closest('#bottomSheet')) return;
            e.preventDefault();
        }, { passive: false });
    </script>

<!-- Script for interactive loading simulation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status-text');
            const chipContainer = document.getElementById('chip-container');
            
            const statuses = [
                "Grinding beans...",
                "Warming the portafilter...",
                "Pouring over...",
                "Aroma identified!"
            ];

            let progress = 0;
            let statusIndex = 0;

            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    statusText.textContent = "Welcome to BrewQuest";
                    // Simulate completion
                    setTimeout(() => {
                        document.body.classList.add('opacity-0', 'transition-opacity', 'duration-1000');
                    }, 1000);
                }

                progressBar.style.width = `${progress}%`;

                // Update status text based on progress
                const nextStatusIndex = Math.min(Math.floor((progress / 100) * statuses.length), statuses.length - 1);
                if (nextStatusIndex !== statusIndex) {
                    statusIndex = nextStatusIndex;
                    statusText.classList.add('opacity-0');
                    setTimeout(() => {
                        statusText.textContent = statuses[statusIndex];
                        statusText.classList.remove('opacity-0');
                    }, 200);
                }

                // Show chips halfway
                if (progress > 40) {
                    chipContainer.classList.remove('opacity-0', 'translate-y-4');
                }
            }, 600);
        });
    </script>
